<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" viewBox="0 0 700 240">
  <style>
    text { font: 20px monospace; fill: #c9d1d9; }
    .green { fill: #3fb950; }
    .blue { fill: #58a6ff; }
    .border { fill: none; stroke: #58a6ff; stroke-width: 2; animation: glow 2.5s ease-in-out infinite; }
    .line { opacity: 0; animation: show 0.7s ease-out forwards; }
    .l1 { animation-delay: 0.5s; }
    .l2 { animation-delay: 1.5s; }
    .l3 { animation-delay: 2.5s; }
    .l4 { animation-delay: 3.5s; }
    .cursor { fill: #58a6ff; animation: blink 1s steps(1) infinite; }
    @keyframes show { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes glow { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
  </style>

  <rect width="700" height="240" rx="12" fill="#0d1117"/>
  <rect class="border" x="1" y="1" width="698" height="238" rx="12"/>

  <circle cx="30" cy="25" r="7" fill="#ff5f56"/>
  <circle cx="53" cy="25" r="7" fill="#ffbd2e"/>
  <circle cx="76" cy="25" r="7" fill="#27c93f"/>

  <g class="line l1"><text x="40" y="80"><tspan class="green">$</tspan> whoami</text></g>
  <g class="line l2"><text x="40" y="115"><tspan class="blue">&gt;</tspan> Hi, I'm YOUR NAME</text></g>
  <g class="line l3"><text x="40" y="150"><tspan class="green">$</tspan> cat skills.txt</text></g>
  <g class="line l4">
    <text x="40" y="185"><tspan class="blue">&gt;</tspan> Python | JS | Linux</text>
    <rect class="cursor" x="300" y="168" width="11" height="22"/>
  </g>
</svg>
