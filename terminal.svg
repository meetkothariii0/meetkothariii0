<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320">
  <style>
    text { font: 20px monospace; fill: #c9d1d9; }
    .green { fill: #3fb950; }
    .blue { fill: #58a6ff; }
    .border { fill: none; stroke: #58a6ff; stroke-width: 2; animation: glow 2.5s ease-in-out infinite; }
    .line { opacity: 0; animation: show 0.7s ease-out forwards; }
    .l1 { animation-delay: 0.5s; }
    .l2 { animation-delay: 1.3s; }
    .l3 { animation-delay: 2.1s; }
    .l4 { animation-delay: 2.9s; }
    .l5 { animation-delay: 3.7s; }
    .l6 { animation-delay: 4.5s; }
    .l7 { animation-delay: 5.3s; }
    .l8 { animation-delay: 6.1s; }
    .cursor { fill: #58a6ff; animation: blink 1s steps(1) infinite; }
    @keyframes show { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes glow { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
  </style>

  <rect width="700" height="320" rx="12" fill="#0d1117"/>
  <rect class="border" x="1" y="1" width="698" height="318" rx="12"/>

  <circle cx="30" cy="25" r="7" fill="#ff5f56"/>
  <circle cx="53" cy="25" r="7" fill="#ffbd2e"/>
  <circle cx="76" cy="25" r="7" fill="#27c93f"/>

  <g class="line l1"><text x="40" y="80"><tspan class="green">$</tspan> whoami</text></g>
  <g class="line l2"><text x="40" y="110"><tspan class="blue">&gt;</tspan> Meet Kothari | Full-Stack Developer</text></g>
  <g class="line l3"><text x="40" y="140"><tspan class="green">$</tspan> cat education.txt</text></g>
  <g class="line l4"><text x="40" y="170"><tspan class="blue">&gt;</tspan> B.Tech IT @ MIT Bengaluru (2027)</text></g>
  <g class="line l5"><text x="40" y="200"><tspan class="green">$</tspan> ls projects/</text></g>
  <g class="line l6"><text x="40" y="230"><tspan class="blue">&gt;</tspan> IronTest  Triply  HealthTrackr</text></g>
  <g class="line l7"><text x="40" y="260"><tspan class="green">$</tspan> echo $STACK</text></g>
  <g class="line l8">
    <text x="40" y="290"><tspan class="blue">&gt;</tspan> React | Next.js | FastAPI | LLMs</text>
    <rect class="cursor" x="456" y="273" width="11" height="22"/>
  </g>
</svg>
